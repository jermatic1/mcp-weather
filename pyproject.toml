[project]
name = "mcp-weather"
version = "0.1.0"
description = "MCP server for National Weather Service conditions and forecasts at a fixed location"
authors = [
    { name = "Jeremy", email = "155401269+jermatic1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "pynws[retry]>=2.1.0",
]

[project.scripts]
mcp-weather = "mcp_weather.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
